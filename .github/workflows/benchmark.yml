name: Benchmark

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "release/**"]
    types: ["opened", "reopened", "synchronize"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Compare Benchmarks
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get Swift Version
        run: swift --version
      - name: Select Comparison Revision
        id: comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          baseline_sha=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            baseline_sha="$BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ] \
            && ! printf '%s' "$BEFORE_SHA" | grep -q '^0*$'; then
            baseline_sha="$BEFORE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == release/* ]]; then
            baseline_sha="$(git rev-parse refs/remotes/origin/main)"
          fi

          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"
      - name: Compare Benchmarks
        env:
          BASELINE_SHA: ${{ steps.comparison.outputs.baseline_sha }}
        run: |
          benchmark_arguments=()

          if [ -n "$BASELINE_SHA" ]; then
            benchmark_arguments+=(
              --baseline "$BASELINE_SHA"
            )
          fi

          swift package plugin --allow-network-connections all benchmark \
            "${benchmark_arguments[@]}" >> "$GITHUB_STEP_SUMMARY"
