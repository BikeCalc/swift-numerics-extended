name: Pull Request Title

on:
  pull_request:
    branches: ["main", "release/**"]
    types: ["opened", "edited", "reopened", "synchronize"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Validate Pull Request Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit Title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(fix|feat|build|chore|ci|docs|style|refactor|perf|test)(\([^()]+\))?!?: .+$'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            exit 0
          fi

          echo "Invalid pull request title: $PR_TITLE"
          echo "Use the Conventional Commit form:"
          echo "<type>[optional scope]: <description>"
          echo "Parentheses around a scope are required. Append ! after the type or scope for a breaking change."
          echo "Allowed types: fix, feat, build, chore, ci, docs, style, refactor, perf, test"
          exit 1
